<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Mantenimiento — Inversiones Montolivo</title>
<style>
:root{
  --maroon-dark:#52101E;
  --maroon:#7A1A2E;
  --maroon-hover:#8f2038;
  --maroon-wash:rgba(122,26,46,0.07);
  --cream:#F8F3EE;
  --card:#FFFFFF;
  --ink:#241B1D;
  --ink-2:#6B5F5C;
  --ink-3:#9A8F8B;
  --border:#E7DFD8;
  --good:#16A34A; --good-text:#15803D; --good-bg:#F0FDF4; --good-border:#BBF0CC;
  --warn:#D97706; --warn-text:#92400E; --warn-bg:#FFFBEB; --warn-border:#FCE3B0;
  --bad:#DC2626;  --bad-text:#991B1B;  --bad-bg:#FEF2F2;  --bad-border:#F8C9C9;
  --chart-1:#2a78d6;
  --chart-2:#eb6834;
  --chart-3:#1baf7a;
  --info-text:#1d4ed8; --info-bg:#EFF6FF; --info-border:#BFDBFE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}

/* ---------- Header ---------- */
.topbar{
  background:linear-gradient(135deg,var(--maroon-dark),var(--maroon));
  color:#fff;
  padding:16px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
.topbar-left{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.topbar-left h1{font-size:20px;margin:0;font-weight:700;letter-spacing:0.2px;}
.topbar-left .sep{opacity:0.5;}
.topbar-left .sub{font-size:13px;font-weight:600;opacity:0.92;}
.topbar-left .tag{display:block;font-size:10.5px;letter-spacing:1.2px;opacity:0.7;margin-top:2px;text-transform:uppercase;}
.topbar-right{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.14);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;}
.dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block;}
@media (max-width:640px){
  .topbar{padding:12px 16px;}
  .topbar-left h1{font-size:17px;}
}

/* ---------- Tabs ---------- */
.tabs{
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  padding:0 20px;
}
.tabs::-webkit-scrollbar{height:5px;}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.tab-btn{
  border:none;background:none;cursor:pointer;
  padding:13px 16px;font-size:13px;font-weight:600;color:var(--ink-2);
  border-bottom:3px solid transparent;white-space:nowrap;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.tab-btn:hover{color:var(--maroon);}
.tab-btn.active{color:var(--maroon);border-bottom-color:var(--maroon);}
.tabs-select-wrap{
  display:none;
  position:relative;
  border-bottom:1px solid var(--border);
  background:var(--card);
}
.tabs-select-wrap::before{
  content:'☰';
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--maroon);font-size:14px;pointer-events:none;
}
.tabs-select-wrap::after{
  content:'▾';
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  color:var(--maroon);font-size:13px;pointer-events:none;
}
.tabs-select{
  width:100%;
  border:none;
  background:transparent;
  color:var(--maroon);
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  padding:13px 40px;
  -webkit-appearance:none;appearance:none;
  cursor:pointer;
}
@media (max-width:640px){
  .tabs{display:none;}
  .tabs-select-wrap{display:block;}
}

/* ---------- Filter bar ---------- */
.filterbar{
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  font-size:12.5px;
}
.filterbar label{color:var(--ink-2);font-weight:600;margin-right:6px;}
.filterbar select, .filterbar input[type=date], .filterbar input[type=text]{
  border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;
  background:#fff;color:var(--ink);font-family:inherit;
}
.filterbar .grp{display:flex;align-items:center;}
.btn{
  border:1px solid var(--maroon);background:var(--maroon);color:#fff;
  border-radius:6px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:var(--maroon-hover);}
.btn.ghost{background:#fff;color:var(--maroon);}
.btn.ghost:hover{background:var(--maroon-wash);}
.presetrow{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--border);background:#fff;border-radius:14px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink-2);font-weight:600;-webkit-tap-highlight-color:transparent;}
.chip.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}

@media (max-width:640px){
  .filterbar{flex-direction:column;align-items:stretch;padding:12px 16px;gap:10px;}
  .filterbar .grp{justify-content:space-between;}
  .filterbar .grp label{margin-right:auto;}
  .filterbar select, .filterbar input[type=date], .filterbar input[type=text]{
    font-size:16px;padding:10px 10px;flex:1;
  }
  .presetrow{width:100%;}
  .chip{flex:1 1 calc(50% - 6px);text-align:center;padding:9px 8px;font-size:12.5px;}
  .btn{width:100%;padding:11px 14px;font-size:13.5px;}
  #rangoResumen{text-align:center;}
}

/* ---------- Layout ---------- */
main{padding:20px 24px 60px;max-width:1400px;margin:0 auto;}
@media (max-width:640px){
  main{padding:14px 12px 40px;}
}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.section-title{
  display:flex;align-items:center;gap:9px;margin:26px 0 12px;font-size:15px;font-weight:700;
}
.section-title:first-child{margin-top:4px;}
.section-title .bar{width:4px;height:16px;background:var(--maroon);border-radius:2px;}
.section-note{font-size:12px;color:var(--ink-3);margin:-6px 0 14px;padding-left:13px;}

.kpi-group{margin-bottom:18px;}
.kpi-group-title{font-size:11px;letter-spacing:0.7px;font-weight:700;color:var(--ink-3);margin-bottom:8px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:8px;}
@media (max-width:640px){
  .kpi-row{grid-template-columns:1fr;}
}
.kpi-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:14px 16px;
}
.kpi-card.good{border-left:4px solid var(--good);}
.kpi-card.warn{border-left:4px solid var(--warn);}
.kpi-card.bad{border-left:4px solid var(--bad);}
.kpi-label{font-size:10.5px;letter-spacing:0.6px;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:6px;}
.kpi-value{font-size:26px;font-weight:800;margin-top:4px;line-height:1.1;}
.kpi-value.good{color:var(--good-text);}
.kpi-value.warn{color:var(--warn-text);}
.kpi-value.bad{color:var(--bad-text);}
.kpi-sub{font-size:11.5px;color:var(--ink-2);margin-top:5px;}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.status-dot.good{background:var(--good);}
.status-dot.warn{background:var(--warn);}
.status-dot.bad{background:var(--bad);}

/* ---- Hero: tarjeta destacada (valor más grande) para KPIs prioritarios ---- */
.kpi-card.hero .kpi-value{font-size:30px;}
.kpi-row.hero{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
.kpi-card.accent-c1{border-left:4px solid var(--chart-1);}
.kpi-card.accent-c1 .kpi-value{color:var(--chart-1);}
.kpi-card.accent-c2{border-left:4px solid var(--chart-2);}
.kpi-card.accent-c2 .kpi-value{color:var(--chart-2);}
.kpi-card.accent-c3{border-left:4px solid var(--chart-3);}
.kpi-card.accent-c3 .kpi-value{color:var(--chart-3);}

/* ---- Meter: tarjeta hero para un % contra un umbral (Cumplimiento, OTIF) ---- */
.meter-track{height:9px;border-radius:5px;overflow:hidden;margin-top:12px;}
.meter-track.good{background:var(--good-bg);}
.meter-track.warn{background:var(--warn-bg);}
.meter-track.bad{background:var(--bad-bg);}
.meter-fill{height:100%;border-radius:5px;transition:width .3s;}
.meter-fill.good{background:var(--good);}
.meter-fill.warn{background:var(--warn);}
.meter-fill.bad{background:var(--bad);}

/* ---- Barra apilada compacta (parte-del-todo): equipos por criticidad ---- */
.stackbar{display:flex;height:30px;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.stackbar-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;}
.stackbar-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);}
.stackbar-legend span{display:inline-flex;align-items:center;gap:6px;}
.stackbar-legend .sw{width:9px;height:9px;border-radius:2px;display:inline-block;}

/* ---- Pulido general: sombra suave en todas las tarjetas ---- */
.kpi-card, .card{box-shadow:0 1px 3px rgba(36,27,29,0.05);}

/* ---- Tarjeta KPI clickeable (abre detalle en modal) ---- */
.kpi-card.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.kpi-card.clickable:hover{border-color:var(--maroon);box-shadow:0 2px 8px rgba(36,27,29,0.12);}
.kpi-card.clickable:focus-visible{outline:2px solid var(--maroon);outline-offset:2px;}
/* Desglose por severidad dentro de una tarjeta KPI (Resumen > Órdenes de trabajo) */
.sev-list{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:4px;}
.sev-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);padding:4px 6px;border-radius:6px;border:1px solid transparent;background:none;font-family:inherit;text-align:left;width:100%;}
.sev-row b{color:var(--ink);font-size:13px;}
.sev-row .sev-time{color:var(--ink-3);font-size:11px;white-space:nowrap;}
button.sev-row{cursor:pointer;}
.sev-row.sev-row-alerta{background:var(--bad-bg);border-color:var(--bad-border);color:var(--bad-text);}
.sev-row.sev-row-alerta b, .sev-row.sev-row-alerta .sev-time{color:var(--bad-text);}
button.sev-row.sev-row-alerta:hover{border-color:var(--bad);background:var(--bad-bg);}
.mini-meter{padding:4px 6px;}
.link-count{background:none;border:none;padding:2px 6px;border-radius:6px;font:inherit;font-weight:700;color:var(--maroon);text-decoration:underline;cursor:pointer;}
.link-count:hover{background:var(--cream);}
.link-count:focus-visible{outline:2px solid var(--maroon);outline-offset:1px;}
.modal-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.modal-filters select{max-width:220px;}
@media (max-width:640px){ .modal-filters select, .modal-filters .searchbox{width:100%;max-width:none;font-size:16px;} }
#costoRepuestosCard, #costoManoObraCard{border-left:4px dashed var(--border);}
#costoRepuestosCard .kpi-value, #costoManoObraCard .kpi-value{color:var(--ink-3);font-size:22px;}
.tipo-line{font-size:12px;color:var(--ink-2);margin-bottom:6px;display:flex;flex-wrap:wrap;column-gap:12px;row-gap:2px;}
.tipo-line span{white-space:nowrap;}
.kpi-card{position:relative;}
.kpi-corner{position:absolute;top:14px;right:16px;text-align:right;line-height:1.2;display:flex;flex-direction:column;align-items:flex-end;}
.kpi-corner b{font-size:15px;color:var(--ink);}
.kpi-card.has-corner .kpi-label{padding-right:100px;}
.kpi-corner span{font-size:10.5px;color:var(--ink-3);}
.estado-chips{display:flex;flex-wrap:wrap;gap:6px 12px;margin:2px 0 8px;font-size:12px;color:var(--ink-2);}
.estado-chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.estado-chip b{color:var(--ink);}
.tipo-line b{color:var(--ink);}
.mini-meter .sev-row{padding:0;white-space:nowrap;}
.mini-meter .meter-track{height:6px;margin-top:4px;}
button.sev-row:hover{border-color:var(--maroon);background:var(--cream);}
button.sev-row:focus-visible{outline:2px solid var(--maroon);outline-offset:1px;}

/* ---- Modal genérico de detalle ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(36,27,29,0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-overlay[hidden]{display:none;}
.modal-box{background:var(--card);border-radius:10px;max-width:1100px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 8px 30px rgba(36,27,29,0.25);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);}
.modal-head h3{margin:0;font-size:15px;}
.modal-close{border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:0 4px;}
.modal-body{padding:16px 18px;}
.wrap-text{white-space:normal;}

.section-block{margin-top:30px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:18px;}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.card-head h3{font-size:13.5px;margin:0;font-weight:700;}
.pill{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--ink-2);}
.card-subhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.chip-row .chip{padding:4px 10px;font-size:11.5px;}
.chip-select{border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--ink-2);background:#fff;cursor:pointer;}
.chip-row-label{font-size:11.5px;font-weight:700;color:var(--ink-2);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  background:var(--maroon);color:#fff;text-align:left;padding:8px 10px;font-size:11px;
  text-transform:uppercase;letter-spacing:0.4px;font-weight:700;white-space:nowrap;
}
thead th:first-child{border-top-left-radius:6px;}
thead th:last-child{border-top-right-radius:6px;}
thead th.sortable-th, thead th{cursor:pointer;user-select:none;}
thead th:hover{background:var(--maroon-dark);}
thead th.sortable-th:hover{background:var(--maroon-dark);}
.sort-arrow{display:inline-block;margin-left:3px;font-size:9px;}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:hover{background:var(--maroon-wash);}
tbody tr:nth-child(even){background:#FBF8F5;}
tbody tr:nth-child(even):hover{background:var(--maroon-wash);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.rank{color:var(--ink-3);font-weight:700;width:28px;}
.barwrap{width:120px;background:var(--border);border-radius:3px;height:7px;overflow:hidden;}
.barfill{height:100%;background:var(--maroon);border-radius:3px;}
.tablewrap{overflow-x:auto;}
.tablewrap-scroll{overflow-x:auto;max-height:360px;overflow-y:auto;}
.tablewrap-scroll thead th{position:sticky;top:0;z-index:1;}
.badge{padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;}
.badge.good{background:var(--good-bg);color:var(--good-text);border:1px solid var(--good-border);}
.badge.warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border);}
.badge.bad{background:var(--bad-bg);color:var(--bad-text);border:1px solid var(--bad-border);}
.badge.neutral{background:var(--cream);color:var(--ink-2);border:1px solid var(--border);}
.badge.info{background:var(--info-bg);color:var(--info-text);border:1px solid var(--info-border);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid2 > *{min-width:0;} /* deja que las tablas anchas hagan scroll dentro de su tarjeta */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

.chartwrap{display:flex;align-items:flex-start;gap:8px;}
.chart-axis{width:30px;flex-shrink:0;position:relative;height:170px;}
.chart-axis-tick{position:absolute;left:0;right:2px;transform:translateY(50%);font-size:10px;color:var(--ink-3);text-align:right;}
.chart-plot{position:relative;height:170px;flex:1;min-width:0;}
.chart-gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--border);}
.chartbox{position:relative;height:170px;display:flex;align-items:flex-end;gap:24px;padding:0 8px;}
.chartcol{width:64px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
.chartbars{display:flex;gap:4px;align-items:flex-end;justify-content:center;width:100%;}
.bar-seg{width:22px;border-radius:3px 3px 0 0;position:relative;cursor:pointer;transition:filter .1s;}
.bar-seg:hover{filter:brightness(1.08);}
.bar-seg .bar-val{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:5px;font-size:11px;font-weight:700;color:var(--ink);background:var(--card);padding:1px 6px;border-radius:4px;border:1px solid var(--border);white-space:nowrap;display:none;box-shadow:0 1px 4px rgba(0,0,0,.12);z-index:2;}
.bar-seg.active .bar-val{display:block;}
.chart-xlabels{display:flex;gap:24px;padding:0 8px;margin-left:38px;margin-top:8px;}
.chart-xlabels .lbl{width:64px;flex-shrink:0;text-align:center;font-size:11px;font-weight:600;color:var(--ink-2);}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-2);margin-top:10px;margin-left:38px;flex-wrap:wrap;}
.legend .sw{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle;}

.callout{border:1px solid var(--warn-border);background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:11px 14px;font-size:12px;margin-bottom:16px;line-height:1.5;}
.callout b{color:var(--warn-text);}
.callout.info{border-color:var(--border);background:#F2EEE9;color:var(--ink-2);}

.pager{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--ink-2);flex-wrap:wrap;}
.pager button{border:1px solid var(--border);background:#fff;border-radius:5px;padding:4px 9px;cursor:pointer;font-size:12px;}
.pager button:disabled{opacity:0.4;cursor:default;}
.searchbox{flex:1;min-width:160px;}
.footer-note{text-align:center;color:var(--ink-3);font-size:11px;padding:20px 0 6px;}
.empty{color:var(--ink-3);font-size:12.5px;padding:20px;text-align:center;}

@media (max-width:640px){
  .card{padding:12px;}
  .card-head{flex-direction:column;align-items:stretch;}
  .card-head select, .card-head .searchbox{width:100%;min-width:0;}
  .card-head select, .card-head input[type=text]{font-size:16px;padding:9px 10px;}
  .pager{justify-content:space-between;}
  .pager button{padding:8px 14px;font-size:13px;}
  .pager span{flex:1 1 100%;order:-1;text-align:center;margin-bottom:4px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div>
      <h1>Inversiones Montolivo</h1>
      <span class="tag">Dashboard de Mantenimiento</span>
    </div>
  </div>
  <div class="topbar-right"><span class="dot"></span><span id="hdrDate">—</span></div>
</div>

<nav class="tabs" id="tabs"></nav>
<div class="tabs-select-wrap">
  <select class="tabs-select" id="tabsSelect"></select>
</div>

<div class="filterbar">
  <div class="grp"><label>Desde</label><input type="date" id="fDesde"></div>
  <div class="grp"><label>Hasta</label><input type="date" id="fHasta"></div>
  <div class="presetrow" id="presets"></div>
  <button class="btn ghost" id="btnLimpiar">↺ Limpiar</button>
  <span class="pill" id="rangoResumen"></span>
</div>

<main id="main"></main>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" id="modalClose">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="footer-note">Generado a partir de exportes de OT, SS, Disponibilidad y Criticidad de equipos · Datos de referencia, sujetos a validación con el jefe de mantenimiento</div>

<script id="dashboard-data" type="application/json">
__DATA_JSON__
</script>

<script>
const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);

/* ============ Helpers ============ */
function parseD(s){ return s ? new Date(s) : null; }
function fmtDate(s){ if(!s) return '—'; const d=parseD(s); return d.toLocaleDateString('es-CO',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
// Fecha + hora en dos líneas (para tablas angostas): "22/8/2026" / "14:00".
function fmtFechaHoraCorta(v){ if(!v) return '—'; const d=parseD(v); return `${d.toLocaleDateString('es-CO')}<br><span style="color:var(--ink-3);font-size:11px;">${d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</span>`; }
function fmtMoney(n){ if(n==null) return '—'; return '$ '+Math.round(n).toLocaleString('es-CO'); }
function fmtPct(n,d=1){ if(n==null||isNaN(n)) return '—'; return n.toFixed(d)+'%'; }
function fmtH(n){ if(n==null||isNaN(n)) return '—'; return n.toFixed(1)+' h'; }
// horas -> días calendario
function fmtDiasDeHoras(n){ if(n==null||isNaN(n)) return '—'; const d=n/24; return d.toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+(d===1?' día':' días'); }
function inRange(dateStr, desde, hasta){
  if(!dateStr) return false;
  const d = parseD(dateStr);
  if(desde && d < desde) return false;
  if(hasta && d > hasta) return false;
  return true;
}
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shortTecnico(s){
  if(!s) return '—';
  return s.split(',').map(n=>{ n=n.trim(); const p=n.split(' '); return p.length>=2? (p[0][0]+p[0].slice(1).toLowerCase()+' '+p[1][0].toUpperCase()+'.') : n; }).join(', ');
}
function statusClass(value, thresholds, inverse){
  // thresholds = {good, warn} numeric cutoffs
  if(value==null||isNaN(value)) return 'neutral';
  if(!inverse){
    if(value>=thresholds.good) return 'good';
    if(value>=thresholds.warn) return 'warn';
    return 'bad';
  } else {
    if(value<=thresholds.good) return 'good';
    if(value<=thresholds.warn) return 'warn';
    return 'bad';
  }
}

/* ============ Modal genérico de detalle ============ */
function openModal(title, bodyHtml){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').hidden = false;
}
function closeModal(){
  document.getElementById('modalOverlay').hidden = true;
}
function setupModal(){
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
}

/* ============ Global filter state ============ */
let FILTER = { desde:null, hasta:null, lugar:null, lugarGlobal:false };

function getFilteredOT(){ return DATA.ot.filter(r=>inRange(r.fecha_creacion, FILTER.desde, FILTER.hasta) && (!FILTER.lugarGlobal || !FILTER.lugar || r.lugar===FILTER.lugar)); }
function getFilteredSS(){ return DATA.ss.filter(r=>inRange(r.fecha_ss, FILTER.desde, FILTER.hasta) && (!FILTER.lugarGlobal || !FILTER.lugar || r.lugar===FILTER.lugar)); }
function getFilteredParos(){ return DATA.paros.filter(r=>inRange(r.inicio, FILTER.desde, FILTER.hasta) && (!FILTER.lugarGlobal || !FILTER.lugar || r.lugar===FILTER.lugar)); }
function getFilteredParosProgramados(){ return (DATA.paros_programados||[]).filter(r=>inRange(r.inicio, FILTER.desde, FILTER.hasta) && (!FILTER.lugarGlobal || !FILTER.lugar || r.lugar===FILTER.lugar)); }

// Lista de puntos de venta / lugares disponibles, para los selects de
// filtro por punto de venta (O.T. y SS).
function lugaresDisponibles(){
  return [...new Set([...DATA.ot.map(r=>r.lugar), ...DATA.ss.map(r=>r.lugar)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
}
// Filtro de "Punto de venta" reutilizable en varias pestañas. Por defecto
// solo afecta la pestaña donde se usa (localState); si se marca "Aplicar a
// todas las pestañas" pasa a guardarse en FILTER.lugar/FILTER.lugarGlobal y
// hace un renderAll() para que el resto del tablero también lo respete.
function lugarFiltroHtml(selectId, checkboxId, localState){
  const lugares = lugaresDisponibles();
  const valor = FILTER.lugarGlobal ? (FILTER.lugar||'') : (localState.value||'');
  return `<span class="chip-row-label">Punto de venta:</span>
    <select id="${selectId}"><option value="">Todos</option>${lugares.map(l=>`<option value="${esc(l)}"${l===valor?' selected':''}>${esc(l)}</option>`).join('')}</select>
    <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);margin-left:10px;white-space:nowrap;"><input type="checkbox" id="${checkboxId}"${FILTER.lugarGlobal?' checked':''}> Aplicar a todas las pestañas</label>`;
}
function wireLugarFiltro(selectId, checkboxId, localState, onLocalChange){
  const sel = document.getElementById(selectId);
  const chk = document.getElementById(checkboxId);
  sel.addEventListener('change', ()=>{
    localState.value = sel.value || null;
    if(chk.checked){ FILTER.lugar = localState.value; renderAll(); }
    else { onLocalChange(); }
  });
  chk.addEventListener('change', ()=>{
    FILTER.lugarGlobal = chk.checked;
    FILTER.lugar = chk.checked ? (sel.value || null) : null;
    renderAll();
  });
}

/* ============ Filtro de equipo propio de la pestana "Tecnicos" ============ */
function splitTecnicos(str){
  if(!str) return [];
  return String(str).split(',').map(s=>s.trim()).filter(Boolean);
}
function wireOtSelectDur(wrapEl){
  wrapEl.addEventListener('change', (e)=>{
    const sel = e.target.closest('.tec-ot-select');
    if(!sel) return;
    const tr = sel.closest('tr');
    const durSpan = tr ? tr.querySelector('.tec-dur') : null;
    if(!durSpan) return;
    const opt = sel.selectedOptions[0];
    if(!opt || !opt.value){ durSpan.textContent = '—'; return; }
    const durAttr = opt.getAttribute('data-dur');
    durSpan.textContent = durAttr ? fmtH(parseFloat(durAttr)) : 'En curso / pendiente';
  });
}
function duracionRealOT(r){
  return (r.inicio_real && r.fin_real) ? (new Date(r.fin_real)-new Date(r.inicio_real))/3600000 : null;
}
function duracionProgramadaOT(r){
  return (r.inicio_programado && r.fin_programado) ? (new Date(r.fin_programado)-new Date(r.inicio_programado))/3600000 : null;
}
// Promedio diario de registros (SS creadas, OT realizadas): registros cuyo
// `campo` cae en el rango filtrado / días calendario del rango (domingos
// incluidos). El rango se acota a las fechas que traen los datos (un filtro
// que llega al futuro, p.ej. "Este mes", no diluye el promedio) y, sin
// "Desde" elegido, arranca en INICIO_USO_CMMS: antes solo hay registros
// sueltos (19/may, 19/ago) que bajarían el promedio (decisión de Mariana).
const INICIO_USO_CMMS = new Date('2026-09-01T00:00:00');
// `universo` = todos los registros (sin filtro de lugar) para fijar el rango
// de fechas con datos, así filtrar por lugar no acorta los días del rango.
function promedioPorDia(rows, campo, universo){
  const fechas = universo.map(r=>r[campo]).filter(Boolean).map(parseD);
  if(!fechas.length) return {n:0, dias:0, prom:null};
  const minF = new Date(Math.min(...fechas)), maxF = new Date(Math.max(...fechas));
  const desdeBase = FILTER.desde || INICIO_USO_CMMS;
  const desde = desdeBase < minF ? minF : desdeBase;
  const hasta = (!FILTER.hasta || FILTER.hasta > maxF) ? maxF : FILTER.hasta;
  const diaUTC = d=>Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  const dias = hasta >= desde ? Math.round((diaUTC(hasta)-diaUTC(desde))/86400000)+1 : 0;
  const n = rows.filter(r=>inRange(r[campo], desde, FILTER.hasta)).length;
  return {n, dias, desde, hasta, prom: dias ? n/dias : null};
}
function kpiPromedioDia(label, p){
  return kpiCard({label, value: p.prom===null?'—':p.prom.toLocaleString('es-CO',{maximumFractionDigits:1})});
}
// Estado de un paro (lo calcula process_dashboard.py): correctivos =
// Fuera de servicio -> En reparación -> Finalizado; preventivos =
// En mantenimiento -> Finalizado.
function badgeEstadoParo(r){
  const e = r.estado_paro || (r.fin ? 'Finalizado' : (r.iniciado ? 'En reparación' : 'Fuera de servicio'));
  const cls = e==='Finalizado' ? 'good' : e==='Fuera de servicio' ? 'bad' : 'warn';
  return `<span class="badge ${cls}">${esc(e)}</span>`;
}
// ss_codigo de un paro puede traer varias SS ("00325, 00326")
// Código(s) de SS tal cual (solo el número, sin prefijo "SS-" - pedido de Mariana).
function fmtSSParo(v){ return v ? String(v).split(',').map(x=>esc(x.trim())).join(', ') : '—'; }
function rangoEfectivoOT(){
  if(FILTER.desde && FILTER.hasta) return {desde:FILTER.desde, hasta:FILTER.hasta};
  const fechas = DATA.ot.map(r=>r.fecha_creacion).filter(Boolean).map(s=>new Date(s));
  // Sin "Desde" elegido, no arranca antes de INICIO_USO_CMMS (antes solo hay
  // OT sueltas, p.ej. una del 19/may, que inflarían las horas disponibles)
  let minF = fechas.length? new Date(Math.min(...fechas)) : new Date();
  if(minF < INICIO_USO_CMMS) minF = INICIO_USO_CMMS;
  const maxF = fechas.length? new Date(Math.max(...fechas)) : new Date();
  return { desde: FILTER.desde || minF, hasta: FILTER.hasta || maxF };
}

// OT "vencida" / "para reprogramar" (definición de Mariana, 29-sep-2026):
// sigue abierta, su Fecha Fin Programado ya pasó (respecto a hoy) y el
// trabajo no está hecho — sin Fecha Fin Real o con Ejecución < 100% (una OT
// con fin real pero ejecución parcial tampoco se ha hecho). Las que sí están
// ejecutadas al 100% solo falta cerrarlas (ver sinCerrarEnSistema).
function otEjecutadaCompleta(r){ return !!r.fin_real && (r.avance||0) >= 100; }
function necesitaReprogramar(r){
  return r.estado==='Abierta' && !otEjecutadaCompleta(r) && !!r.fin_programado
    && new Date(r.fin_programado) < new Date();
}
// Abierta en el CMMS pero con Fecha Fin Real y 100% de ejecución: el
// trabajo se hizo, falta cerrarla.
function sinCerrarEnSistema(r){ return r.estado==='Abierta' && otEjecutadaCompleta(r); }
// Días completos transcurridos desde la Fecha Fin Programado hasta hoy.
function diasAtrasoOT(r){
  return Math.floor((new Date() - new Date(r.fin_programado))/86400000);
}

/* ============ Tabs config ============ */
const TABS = [
  {id:'resumen', label:'Resumen Gerencial', render: renderResumen},
  {id:'ot', label:'Órdenes de Trabajo', render: renderOT},
  {id:'tecnicos', label:'Técnicos', render: renderTecnicos},
  {id:'ss', label:'Solicitudes de Servicio', render: renderSS},
  {id:'paros', label:'Paros por Equipo', render: renderParos},
  {id:'disponibilidad', label:'Equipos', render: renderDisponibilidad},
  {id:'costos', label:'Costos de Mantenimiento', render: renderCostos},
];

function activateTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
  const sel = document.getElementById('tabsSelect');
  if(sel.value!==id) sel.value = id;
}
function buildTabsNav(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  nav.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> activateTab(btn.dataset.tab));
  });
  const sel = document.getElementById('tabsSelect');
  sel.innerHTML = TABS.map(t=>`<option value="${t.id}">${t.label}</option>`).join('');
  sel.addEventListener('change', ()=> activateTab(sel.value));
}
function buildPanels(){
  const main = document.getElementById('main');
  main.innerHTML = TABS.map((t,i)=>`<section class="tabpanel${i===0?' active':''}" id="panel-${t.id}"></section>`).join('');
}
function renderAll(){
  TABS.forEach(t=>{ t.render(document.getElementById('panel-'+t.id)); });
  const dr = document.getElementById('rangoResumen');
  const d = FILTER.desde ? FILTER.desde.toLocaleDateString('es-CO') : 'inicio';
  const h = FILTER.hasta ? FILTER.hasta.toLocaleDateString('es-CO') : 'hoy';
  dr.textContent = `Rango: ${d} → ${h}`;
}

/* ============ Filter bar wiring ============ */
function setupFilterBar(){
  const fDesde = document.getElementById('fDesde');
  const fHasta = document.getElementById('fHasta');
  fDesde.addEventListener('change', ()=>{ FILTER.desde = fDesde.value? new Date(fDesde.value+'T00:00:00'):null; setActivePreset(null); renderAll(); });
  fHasta.addEventListener('change', ()=>{ FILTER.hasta = fHasta.value? new Date(fHasta.value+'T23:59:59'):null; setActivePreset(null); renderAll(); });
  document.getElementById('btnLimpiar').addEventListener('click', ()=>{
    FILTER = {desde:null, hasta:null, lugar:null, lugarGlobal:false}; fDesde.value=''; fHasta.value='';
    setActivePreset('todo'); renderAll();
  });

  const presets = [
    {id:'todo', label:'Todo el periodo', fn:()=>({desde:null,hasta:null})},
    {id:'30d', label:'Últimos 30 días', fn:()=>{ const h=new Date(); const d=new Date(); d.setDate(d.getDate()-30); return {desde:d,hasta:h}; }},
    {id:'mes', label:'Este mes', fn:()=>{ const h=new Date(); const d=new Date(h.getFullYear(),h.getMonth(),1); return {desde:d,hasta:h}; }},
    {id:'semana', label:'Últimos 7 días', fn:()=>{ const h=new Date(); const d=new Date(); d.setDate(d.getDate()-7); return {desde:d,hasta:h}; }},
  ];
  const row = document.getElementById('presets');
  row.innerHTML = presets.map(p=>`<span class="chip" data-p="${p.id}">${p.label}</span>`).join('');
  row.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const p = presets.find(x=>x.id===chip.dataset.p);
      FILTER = {...FILTER, ...p.fn()};
      fDesde.value = FILTER.desde? FILTER.desde.toISOString().slice(0,10) : '';
      fHasta.value = FILTER.hasta? FILTER.hasta.toISOString().slice(0,10) : '';
      setActivePreset(p.id);
      renderAll();
    });
  });
  setActivePreset('todo');
}
function setActivePreset(id){
  document.querySelectorAll('#presets .chip').forEach(c=>c.classList.toggle('active', c.dataset.p===id));
}

/* ============ Reusable render helpers ============ */
function kpiCard({label, value, sub, status, hero, accent, id, clickable, corner}){
  const st = status || '';
  const cls = ['kpi-card', st, hero?'hero':'', accent?'accent-'+accent:'', clickable?'clickable':'', corner?'has-corner':''].filter(Boolean).join(' ');
  return `<div class="${cls}"${id?` id="${id}"`:''}>
    ${corner?`<div class="kpi-corner">${corner}</div>`:''}
    <div class="kpi-label">${status?`<span class="status-dot ${st}"></span>`:''}${label}</div>
    <div class="kpi-value ${st}">${value}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}
function kpiGroup(title, cardsHtml, hero){
  return `<div class="kpi-group">
    <div class="kpi-group-title">${esc(title).toUpperCase()}</div>
    <div class="kpi-row${hero?' hero':''}">${cardsHtml}</div>
  </div>`;
}
// Tarjeta "meter": un % contra un umbral, con barra de progreso coloreada
// por estado (verde/ámbar/rojo) - para métricas tipo "Cumplimiento" u "OTIF".
function meterHero({label, pct, sub, status}){
  const st = status || 'good';
  const w = pct==null ? 0 : Math.max(0, Math.min(100, pct));
  return `<div class="kpi-card hero meter">
    <div class="kpi-label"><span class="status-dot ${st}"></span>${label}</div>
    <div class="kpi-value ${st}">${fmtPct(pct)}</div>
    <div class="meter-track ${st}"><div class="meter-fill ${st}" style="width:${w}%"></div></div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}
// Barra apilada compacta para una variable parte-del-todo (ej. equipos por
// criticidad) - más legible que una dona para pocas categorías con etiqueta.
function stackBar(segments){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  return `<div class="stackbar">${segments.filter(s=>s.value>0).map(s=>`<div class="stackbar-seg" style="width:${(s.value/total*100).toFixed(1)}%;background:${s.color}">${s.value}</div>`).join('')}</div>
  <div class="stackbar-legend">${segments.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${s.label} (${s.value})</span>`).join('')}</div>`;
}
function sectionTitle(text, note){
  return `<div class="section-title"><span class="bar"></span>${text}</div>${note?`<div class="section-note">${note}</div>`:''}`;
}
function rankedTable(rows, {labelKey, countKey, extraCols=[], noBar=false, countFmt}){
  const max = Math.max(...rows.map(r=>r[countKey.key]||0), 1);
  return `<div class="tablewrap"><table><thead><tr><th>#</th><th>${labelKey.label}</th>${extraCols.map(c=>`<th class="num">${c.label}</th>`).join('')}<th>${countKey.label||'Cantidad'}</th>${noBar?'':'<th>Barra</th>'}</tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(r[labelKey.key])}</td>${extraCols.map(c=>`<td class="num">${c.fmt?c.fmt(r[c.key]):r[c.key]}</td>`).join('')}<td class="num">${countFmt?countFmt(r[countKey.key]):r[countKey.key]}</td>${noBar?'':`<td><div class="barwrap"><div class="barfill" style="width:${(r[countKey.key]/max*100).toFixed(0)}%"></div></div></td>`}</tr>`).join('')}
  </tbody></table></div>`;
}
function groupCount(arr, keyFn){
  const m = new Map();
  arr.forEach(x=>{ const k=keyFn(x); if(k==null) return; m.set(k, (m.get(k)||0)+1); });
  return [...m.entries()].map(([k,v])=>({key:k,count:v})).sort((a,b)=>b.count-a.count);
}
function groupSum(arr, keyFn, valFn){
  const m = new Map();
  arr.forEach(x=>{ const k=keyFn(x); if(k==null) return; m.set(k, (m.get(k)||0)+(valFn(x)||0)); });
  return [...m.entries()].map(([k,v])=>({key:k,sum:v})).sort((a,b)=>b.sum-a.sum);
}
function simpleTable(rows, columns, opts={}){
  const cls = opts.scroll ? 'tablewrap tablewrap-scroll' : 'tablewrap';
  return `<div class="${cls}"><table><thead><tr>${columns.map(c=>`<th${c.num?' class="num"':''}>${c.label}</th>`).join('')}</tr></thead><tbody>
  ${rows.length? rows.map(r=>`<tr>${columns.map(c=>`<td${c.num?' class="num"':''}>${c.fmt?c.fmt(r[c.key],r):esc(r[c.key]??'—')}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${columns.length}" class="empty">Sin datos</td></tr>`}
  </tbody></table></div>`;
}
function groupSSPorLugar(rows){
  const map = new Map();
  rows.forEach(r=>{
    const key = r.lugar || 'Sin dato';
    if(!map.has(key)) map.set(key, {lugar:key, total:0, abiertas:0});
    const c = map.get(key);
    c.total++;
    if(!r.fecha_respuesta) c.abiertas++;
  });
  return [...map.values()].map(c=>({...c, pct: c.total? (c.abiertas/c.total*100) : null})).sort((a,b)=>b.total-a.total);
}
function groupOTPorLugar(rows){
  const map = new Map();
  rows.forEach(r=>{
    const key = r.lugar || 'Sin dato';
    if(!map.has(key)) map.set(key, {lugar:key, total:0, trabajando:0, sinIniciar:0, cerradas:0});
    const c = map.get(key);
    c.total++;
    if(r.estado==='Abierta'){
      if(r.avance>0) c.trabajando++; else c.sinIniciar++;
    } else if(r.estado==='Cerrada'){
      c.cerradas++;
    }
  });
  return [...map.values()].sort((a,b)=>b.total-a.total);
}
function monthKey(dateStr){ if(!dateStr) return null; const d=parseD(dateStr); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(k){ const [y,m]=k.split('-'); const names=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return names[parseInt(m)-1]+' '+y.slice(2); }

function niceAxis(max, targetTicks){
  targetTicks = targetTicks || 4;
  if(max<=0) return {niceMax:1, ticks:[0,1]};
  const rawStep = max/targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep/mag;
  const step = (norm<=1?1:norm<=2?2:norm<=5?5:10)*mag;
  const niceMax = Math.ceil(max/step)*step;
  const ticks = [];
  for(let v=0; v<=niceMax+1e-9; v+=step) ticks.push(Math.round(v*100)/100);
  return {niceMax, ticks};
}
/* Gráfica de barras agrupadas con eje Y (líneas de referencia + valores) y
   clic en cada barra para mostrar su cantidad exacta (además del tooltip
   nativo al pasar el mouse). categories: [k1,k2,...]; series: [{label,
   values:{k:v}}]; opts.labelFn formatea cada categoría para el eje X. */
function groupedBarChart(categories, series, colors, opts){
  opts = opts || {};
  const labelFn = opts.labelFn || (c=>c);
  const PLOT_H = 170;
  const allVals = categories.flatMap(c=>series.map(s=>s.values[c]||0));
  const rawMax = Math.max(...allVals, 0);
  const {niceMax, ticks} = niceAxis(rawMax);
  const axisHtml = ticks.map(t=>`<div class="chart-axis-tick" style="bottom:${(t/niceMax*100).toFixed(2)}%">${t}</div>`).join('');
  const gridHtml = ticks.map(t=>`<div class="chart-gridline" style="bottom:${(t/niceMax*100).toFixed(2)}%"></div>`).join('');
  const cols = categories.map(c=>{
    const bars = series.map((s,i)=>{
      const v = s.values[c]||0;
      const h = niceMax? Math.round(v/niceMax*PLOT_H) : 0;

/* generic paginated + searchable table for large datasets */
/* Ordenar cualquier tabla al hacer clic en su título (pedido de Mariana).
   Las tablas paginadas (buildPagedTable) ya ordenan sus datos completos con
   .sortable-th; este manejador global cubre todas las demás (listados
   emergentes, tablas pequeñas): ordena las filas visibles según el texto de
   la celda, entendiendo dinero ($ 1.234.567), números, %, horas/días y
   fechas dd/mm/aaaa. Clic de nuevo invierte el orden; vacíos siempre al final. */
function valorOrden(txt){
  const t = String(txt||'').trim();
  if(!t || t==='—' || t==='-') return null;
  const f = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]*(\d{1,2}):(\d{2})\s*([ap])?)?/i);
  if(f){
    let h = f[4]? +f[4] : 0;
    if(f[6]){ const pm = f[6].toLowerCase()==='p'; if(pm && h<12) h+=12; if(!pm && h===12) h=0; }
    return new Date(+f[3], +f[2]-1, +f[1], h, f[5]? +f[5] : 0).getTime();
  }
  if(t.includes('$')){ const n = t.replace(/[^\d,-]/g,'').replace(',', '.'); return n? parseFloat(n) : null; }
  const m = t.match(/^-?[\d.,]+/);
  if(m){
    let n = m[0];
    if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(n)) n = n.replace(/\./g,'').replace(',', '.'); // 1.234.567,8
    else n = n.replace(',', '.');                                                        // 7.5 / 7,5
    const v = parseFloat(n); if(!isNaN(v)) return v;
  }
  return t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
}
function ordenarTablaPorColumna(th){
  const table = th.closest('table'); const tbody = table && table.tBodies[0];
  if(!tbody) return;
  const idx = [...th.parentNode.children].indexOf(th);
  const filas = [...tbody.rows].filter(tr=>!tr.querySelector('td[colspan]'));
  if(filas.length < 2) return;
  const dir = th.dataset.ordenDir==='asc' ? 'desc' : 'asc';
  th.parentNode.querySelectorAll('th').forEach(x=>{ delete x.dataset.ordenDir; const a=x.querySelector('.sort-arrow'); if(a) a.textContent=''; });
  th.dataset.ordenDir = dir;
  let a = th.querySelector('.sort-arrow'); if(!a){ a=document.createElement('span'); a.className='sort-arrow'; th.appendChild(a); }
  a.textContent = dir==='asc' ? ' ▲' : ' ▼';
  const sign = dir==='asc' ? 1 : -1;
  const conValor = filas.map(tr=>({tr, v: valorOrden(tr.cells[idx] ? tr.cells[idx].textContent : '')}));
  conValor.sort((x,y)=>{
    if(x.v===null && y.v===null) return 0;
    if(x.v===null) return 1; if(y.v===null) return -1;
    if(typeof x.v==='number' && typeof y.v==='number') return (x.v-y.v)*sign;
    return String(x.v).localeCompare(String(y.v))*sign;
  });
  conValor.forEach(({tr})=>tbody.appendChild(tr));
}
document.addEventListener('click', e=>{
  const th = e.target.closest('thead th');
  if(!th || th.classList.contains('sortable-th') || th.closest('[data-no-orden]')) return;
  ordenarTablaPorColumna(th);
});

/* generic paginated + searchable + sortable table for large datasets */
function buildPagedTable(containerId, allRows, columns, opts={}){
  const pageSize = opts.pageSize || 15;
  let page = 0;
  let filtered = allRows;
  let sortKey = null, sortDir = 1; // 1 = asc, -1 = desc
  function getSortVal(r, c){
    if(c.sortVal) return c.sortVal(r);
    return r[c.key];
  }
  function applySort(){
    if(!sortKey) return;
    const col = columns.find(c=>c.key===sortKey);
    if(!col) return;
    filtered = filtered.slice().sort((a,b)=>{
      let va = getSortVal(a,col), vb = getSortVal(b,col);
      const na = (va===null||va===undefined||va===''), nb = (vb===null||vb===undefined||vb==='');
      if(na && nb) return 0;
      if(na) return 1; // vacíos siempre al final sin importar la dirección
      if(nb) return -1;
      if(typeof va === 'string' && typeof vb === 'string'){
        return va.localeCompare(vb) * sortDir;
      }
      if(va < vb) return -1*sortDir;
      if(va > vb) return 1*sortDir;
      return 0;
    });
  }
  function applyFilter(term){
    if(!term){ filtered = allRows; }
    else{
      const t = term.toLowerCase();
      filtered = allRows.filter(r => columns.some(c => String(r[c.key]??'').toLowerCase().includes(t)));
    }
    applySort();
    page = 0; draw();
  }
  function draw(){
    const start = page*pageSize;
    const rows = filtered.slice(start, start+pageSize);
    const thead = columns.map(c=>{
      const sortable = c.sortable!==false;
      let arrow = '';
      if(sortable && sortKey===c.key) arrow = sortDir===1 ? ' ▲' : ' ▼';
      const cls = [c.num?'num':'', sortable?'sortable-th':''].filter(Boolean).join(' ');
      return `<th${cls?` class="${cls}"`:''}${sortable?` data-sortkey="${c.key}"`:''}>${c.label}${sortable?`<span class="sort-arrow">${arrow}</span>`:''}</th>`;
    }).join('');
    const tbl = `<div class="tablewrap"><table><thead><tr>${thead}</tr></thead><tbody>
      ${rows.length? rows.map(r=>`<tr>${columns.map(c=>`<td${c.num?' class="num"':''}>${c.fmt? c.fmt(r[c.key],r) : esc(r[c.key]??'—')}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${columns.length}" class="empty">Sin resultados</td></tr>`}
      </tbody></table></div>
      <div class="pager">
        <button id="${containerId}-prev" ${page===0?'disabled':''}>← Anterior</button>
        <span>Página ${filtered.length?page+1:0} de ${Math.max(1,Math.ceil(filtered.length/pageSize))} · ${filtered.length} registros</span>
        <button id="${containerId}-next" ${(start+pageSize)>=filtered.length?'disabled':''}>Siguiente →</button>
      </div>`;
    document.getElementById(containerId).innerHTML = tbl;
    const prev = document.getElementById(containerId+'-prev'); if(prev) prev.onclick=()=>{page--;draw();};
    const next = document.getElementById(containerId+'-next'); if(next) next.onclick=()=>{page++;draw();};
    document.getElementById(containerId).querySelectorAll('.sortable-th').forEach(th=>{
      th.addEventListener('click', ()=>{
        const key = th.getAttribute('data-sortkey');
        if(sortKey===key){ sortDir = -sortDir; } else { sortKey = key; sortDir = 1; }
        applySort();
        page = 0; draw();
      });
    });
  }
  draw();
  return { setFilter: applyFilter, refresh: (newRows)=>{ allRows=newRows; filtered=newRows; applySort(); page=0; draw(); } };
}

  const ss = getFilteredSS();

/* Listado en ventana emergente con filtros (Resumen Gerencial): buscador de
   texto libre sobre todas las columnas + un desplegable por cada campo de
   `filtros` que tenga más de un valor. Con opts.costo muestra el costo total
   de las filas filtradas. */
function normBusqueda(t){ return String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function modalFiltrable(titulo, rows, cols, opts={}){
  const filtros = (opts.filtros || [['tipo','Tipo'],['estado','Estado'],['severidad','Severidad'],['lugar','Lugar']])
    .map(([k,l])=>({k, l, vals:[...new Set(rows.map(r=>r[k]).filter(v=>v!=null && v!==''))].sort((a,b)=>String(a).localeCompare(String(b)))}))
    .filter(f=>f.vals.length>1);
  const cellText = (c,r) => { const v = c.fmt ? c.fmt(r[c.key], r) : r[c.key]; const d=document.createElement('div'); d.innerHTML = v==null?'':String(v); return d.textContent; };
  openModal(`${titulo} (${rows.length})`, `
    <div class="modal-filters">
      <input class="searchbox" type="text" id="mfBuscar" placeholder="${esc(opts.placeholder||'Buscar por OT, equipo, lugar, técnico...')}">
      ${filtros.map(f=>`<select data-mf="${esc(f.k)}"><option value="">${esc(f.l)}: todos</option>${f.vals.map(v=>`<option value="${esc(v)}">${esc(String(v).split(',')[0])}</option>`).join('')}</select>`).join('')}
    </div>
    <div class="tipo-line" id="mfResumen" style="margin-bottom:8px;font-size:13px;"></div>
    <div id="mfTabla"></div>`);
  const body = document.getElementById('modalBody');
  const input = body.querySelector('#mfBuscar');
  const selects = [...body.querySelectorAll('select[data-mf]')];
  const pintar = () => {
    const term = normBusqueda(input.value.trim());
    const sel = selects.map(s=>[s.dataset.mf, s.value]).filter(([,v])=>v);
    const f = rows.filter(r => sel.every(([k,v])=>String(r[k])===v)
      && (!term || cols.some(c=>normBusqueda(cellText(c,r)).includes(term))));
    body.querySelector('#mfResumen').innerHTML = `<span>Mostrando <b>${f.length}</b> de ${rows.length}</span>`
      + (opts.costo ? `<span>Costo total: <b>${fmtMoney(f.reduce((a,r)=>a+(r.costo_real||0),0))}</b></span>` : '');
    body.querySelector('#mfTabla').innerHTML = simpleTable(f, cols, {scroll:true});
  };
  input.addEventListener('input', pintar);
  selects.forEach(s=>s.addEventListener('change', pintar));
  pintar();
}

function chartTipoSeveridad(ot){

    .sort((a,b)=> (ORDEN_SEVERIDAD[a]??99)-(ORDEN_SEVERIDAD[b]??99) || a.localeCompare(b));

// Clasificación de un ejecutor en tres grupos, reutilizada en las pestañas
// "Órdenes de Trabajo" y "Técnicos":
//   - interno: aparece en TECNICOS.xlsx (o ALIAS_TECNICOS) - ver
//     cargar_tecnicos() en process_dashboard.py.
//   - proveedor: no es interno, pero su nombre aparece tal cual en el
//     maestro Datos Generales de Proveedores.xlsx (DATA.proveedores) - ver
//     cargar_proveedores() en process_dashboard.py.
//   - otro: no es interno y tampoco aparece en ese maestro de proveedores
//     ni en PROVEEDORES_EXTRA del script (ahí está p.ej. "SEBASTIAN
//     BUITRAGO GRACIANO", que Mariana decidió contar como proveedor).
// Si DATA.tecnicos_internos es null (no se encontró TECNICOS.xlsx) se trata
// a todos como internos. Si DATA.proveedores es null, ningún ejecutor no
// interno se reconoce como "proveedor" - todos caen en "otro".
function tecnicosInternosSetOf(){ return new Set(DATA.tecnicos_internos || []); }
function proveedoresSetOf(){ return new Set(DATA.proveedores || []); }
function esOTProveedor(r, internosSet, proveedoresSet){
  return splitTecnicos(r.tecnico).some(t=>!internosSet.has(t) && proveedoresSet.has(t));
}
function esOTOtro(r, internosSet, proveedoresSet){
  return splitTecnicos(r.tecnico).some(t=>!internosSet.has(t) && !proveedoresSet.has(t));
}
function avgDesvioInicio(rows){
  const vals = rows.map(r=>{ if(!r.inicio_real||!r.inicio_programado) return null; return (new Date(r.inicio_real)-new Date(r.inicio_programado))/3600000; }).filter(v=>v!=null);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function avgDuracion(rows){
  const vals = rows.map(r=>{ if(!r.inicio_real||!r.fin_real) return null; return (new Date(r.fin_real)-new Date(r.inicio_real))/3600000; }).filter(v=>v!=null);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function avgDuracionProgramada(rows){
  const vals = rows.map(r=>duracionProgramadaOT(r)).filter(v=>v!=null);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function cumplimientoOT(r){
  const ahora = new Date();
  if(r.estado === 'Cerrada'){
    if(!r.fin_real || !r.fin_programado) return 'si'; // cerrada sin fecha de referencia, se asume cumplida
    return new Date(r.fin_real) <= new Date(r.fin_programado) ? 'si' : 'no';
  }
  // sigue abierta - sin importar si por error de captura ya tiene Fecha Fin Real
  if(r.fin_programado && ahora > new Date(r.fin_programado)) return 'no';
  if(r.inicio_programado && ahora < new Date(r.inicio_programado)) return 'pendiente';
  return 'en_proceso';
}
function cumplimientoStats(rows){
  const c = {si:0, no:0, en_proceso:0, pendiente:0};
  rows.forEach(r=>{ c[cumplimientoOT(r)]++; });
  const total = rows.length || 1;
  return {...c, total:rows.length,
    pctSi:rows.length?c.si/total*100:null,
    pctNo:rows.length?c.no/total*100:null,
    pctEnProceso:rows.length?c.en_proceso/total*100:null,
    pctPendiente:rows.length?c.pendiente/total*100:null};
}

/* ============ TAB: Paros por Equipo ============ */
function renderParos(el){
  // Paros (correctivos y preventivos sobre equipos que generan paro) cuya
  // fecha de paro cae en el rango filtrado, finalizados incluidos - mismo
  // criterio que "Paros en el periodo" del Resumen Gerencial. Respeta el
  // lugar global. (Antes esta pestaña ignoraba el filtro y mostraba solo los
  // paros abiertos; Mariana pidió que respete el filtro.)
  // Días parados: finalizado = duración real; abierto = desde el inicio hasta hoy.
  const hoy = new Date();
  const paros = [
    ...getFilteredParos().map(p=>({...p, tipo:'Correctivo'})),
    ...getFilteredParosProgramados().map(p=>({...p, tipo:'Preventivo'})),
  ].map(p=>{
    const dias = p.fin ? (p.duracion_h!=null ? p.duracion_h/24 : null)
      : (p.inicio? (hoy - new Date(p.inicio))/86400000 : null);
    return {...p, dias};
  }).sort((a,b)=>(b.dias||0)-(a.dias||0));

  const totalHorasParado = paros.reduce((s,p)=>s+(p.dias!=null? p.dias*24 : 0),0);
  const promHorasParado = paros.length? totalHorasParado/paros.length : null;
  const fueraServicio = paros.filter(p=>p.estado_paro==='Fuera de servicio').length;
  const enReparacion = paros.filter(p=>p.estado_paro==='En reparación' || p.estado_paro==='En mantenimiento').length;

  // 1) Paros actuales por lugar
  const lugarMap = new Map();
  paros.forEach(p=>{
    const key = p.lugar || 'Sin dato';
    if(!lugarMap.has(key)) lugarMap.set(key, {lugar:key, total:0, sumaDias:0, nDias:0});
    const c = lugarMap.get(key);
    c.total++;
    if(p.dias!=null){ c.sumaDias += p.dias; c.nDias++; }
  });
  const porLugar = [...lugarMap.values()]
    .map(c=>({lugar:c.lugar, total:c.total, diasProm: c.nDias? c.sumaDias/c.nDias : null}))
    .sort((a,b)=>b.total-a.total);

  const paradasActuales = paros;

  // 2) Frecuencia de mantenimiento por equipo: cada cuánto se le hace UNA
  // intervención (correctiva o preventiva) a cada equipo puntual - OT del
  // rango filtrado (por fecha de creación, como el resto del tablero). No es
  // lo mismo que "paros": aquí cuenta cualquier OT resuelta a un equipo, no
  // solo las que provocan paro.
  const eqMap = new Map();
  getFilteredOT().forEach(r=>{
    if(!r.equipo_cod) return;
    const fecha = r.inicio_real || r.inicio_programado || r.fecha_creacion;
    if(!fecha) return;
    if(!eqMap.has(r.equipo_cod)) eqMap.set(r.equipo_cod, {equipo:r.equipo, lugar:r.lugar, fechas:[]});
    eqMap.get(r.equipo_cod).fechas.push(new Date(fecha));
  });
  const frecuencia = [...eqMap.values()].filter(c=>c.fechas.length>=2).map(c=>{
    const fechas = [...c.fechas].sort((a,b)=>a-b);
    const diffs = [];
    for(let i=1;i<fechas.length;i++) diffs.push((fechas[i]-fechas[i-1])/86400000);
    const promedio = diffs.reduce((a,b)=>a+b,0)/diffs.length;
    return {equipo:c.equipo, lugar:c.lugar, n:c.fechas.length, promedio};
  }).sort((a,b)=>a.promedio-b.promedio);

  el.innerHTML = `
  ${sectionTitle('Paros por equipo', `${paros.length} paros con fecha de paro en el rango seleccionado (correctivos y preventivos sobre equipos que generan paro, finalizados incluidos) — el módulo de paros del sistema aún no reporta datos propios`)}
  <div class="callout info"><b>Cómo se mide un paro correctivo:</b> empieza cuando se reporta una <b>SS</b> sobre un equipo marcado en Mantum como "Provoca paro" (si la OT se creó sin SS, empieza en la creación de la OT). <b>Fuera de servicio</b> = reportado, todavía nadie empezó a trabajar (sin OT o sin Fecha Inicio Real). <b>En reparación</b> = la OT ya tiene Fecha Inicio Real. <b>Finalizado</b> = la OT tiene Fecha Fin Real (o la SS se cerró). Varias SS del mismo equipo abiertas a la vez, o enlazadas a la misma OT, cuentan como un solo paro. Los <b>preventivos</b> solo cuentan desde que el técnico inicia (En mantenimiento → Finalizado).</div>
  <div class="kpi-row">
    ${kpiCard({label:'Total de paros del periodo', value:paros.length})}
    ${kpiCard({label:'Días promedio parado', value:fmtDiasDeHoras(promHorasParado)})}
    ${kpiCard({label:'Fuera de servicio', value:fueraServicio, status: fueraServicio>0?'bad':'good'})}
    ${kpiCard({label:'En reparación', value:enReparacion, status: enReparacion>0?'warn':'good'})}
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-head"><h3>Paros del periodo por lugar</h3></div>
      ${simpleTable(porLugar, [
        {key:'lugar', label:'Lugar'},
        {key:'total', label:'Total de paros', num:true},
        {key:'diasProm', label:'Días promedio parado', num:true, fmt:v=>v==null?'—':v.toFixed(1)},
      ], {scroll:true})}
    </div>
    <div class="card">
      <div class="card-head"><h3>Paros del periodo — detalle</h3></div>
      ${paradasActuales.length? simpleTable(paradasActuales, [
        {key:'tipo', label:'Tipo'},
        {key:'ot', label:'OT'},
        {key:'ss_codigo', label:'SS asociada', fmt:fmtSSParo},
        {key:'estado_paro', label:'Estado', fmt:(v,r)=> badgeEstadoParo(r)},
        {key:'equipo', label:'Equipo'},
        {key:'lugar', label:'Lugar'},
        {key:'inicio', label:'Inicio del paro', fmt:fmtDate},
        {key:'inicio_trabajo', label:'Inicio reparación', fmt:(v,r)=>fmtDate(v || (r.tipo==='Preventivo' ? r.inicio : null))},
        {key:'dias', label:'Días parados', num:true, fmt:v=> v==null?'—':v.toFixed(1)},
        {key:'tecnico', label:'Técnico asignado', fmt:v=> v? shortTecnico(v) : '—'},
      ], {scroll:true}) : '<div class="empty">No hay paros en el rango seleccionado</div>'}
    </div>
  </div>
  <div class="card section-block">
    <div class="card-head"><h3>Frecuencia de mantenimiento por equipo</h3></div>
    <div class="section-note" style="margin:0 0 10px;">Cada cuánto recibe una intervención (correctiva o preventiva) cada equipo puntual — no es lo mismo que "paros": aquí cuenta toda OT resuelta a un equipo, sin filtrar por si provoca paro. Usa las OT creadas en el rango de fechas seleccionado arriba.</div>
    ${simpleTable(frecuencia, [
      {key:'equipo', label:'Equipo'},
      {key:'lugar', label:'Lugar'},
      {key:'n', label:'Mantenimientos en el periodo', num:true},
      {key:'promedio', label:'Promedio de días entre mantenimientos', num:true, fmt:v=>v.toFixed(1)},
    ], {scroll:true})}
    <div class="section-note" style="margin-top:10px;">Solo se muestran equipos con 2 o más mantenimientos (correctivos + preventivos) registrados en el rango seleccionado.</div>
  </div>
  `;
}

/* ============ TAB: Técnicos ============ */
// Horas hábiles por día de semana (Date.getDay(): 0=domingo...6=sábado).
// Lunes a jueves 8h, viernes 7h, sábado 3h = 42h/semana. Domingo no es
// laborable - si un técnico trabaja ese día, cuenta como hora extra (ver
// más abajo), no como parte de las horas disponibles.
const HORAS_POR_DIA = {0:0, 1:8, 2:8, 3:8, 4:8, 5:7, 6:3};
// Días laborables (lunes a sábado) del rango - mismo recorrido día a día
// que horasDisponiblesRango
function diasLaborablesRango(desde, hasta){
  let n = 0;
  const cur = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate());
  const fin = new Date(hasta.getFullYear(), hasta.getMonth(), hasta.getDate());
  while(cur <= fin){ if(HORAS_POR_DIA[cur.getDay()]>0) n++; cur.setDate(cur.getDate()+1); }
  return n;
}
function horasDisponiblesRango(desde, hasta){
  let total = 0;
  const cur = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate());
  const fin = new Date(hasta.getFullYear(), hasta.getMonth(), hasta.getDate());
  while(cur <= fin){
    total += HORAS_POR_DIA[cur.getDay()];
    cur.setDate(cur.getDate()+1);
  }
  return total;
}
// Lista de técnicos internos (planta), como aparecen en el campo
// Ejecutores. Si no se encontró TECNICOS.xlsx, se derivan todos los
// nombres que aparecen alguna vez en las OT (no se separan terceros).
// Técnicos internos ACTIVOS (sin los ESTADO = INACTIVO de TECNICOS.xlsx, que
// ya no trabajan en la compañía) - usado para "dónde está cada técnico".
function tecnicosInternosList(){
  const inactivos = new Set(DATA.tecnicos_inactivos || []);
  if(DATA.tecnicos_internos) return DATA.tecnicos_internos.filter(t=>!inactivos.has(t));
  const set = new Set();
  DATA.ot.forEach(r=> splitTecnicos(r.tecnico).forEach(t=>set.add(t)));
  return [...set];
}
// Momento de referencia para "dónde está cada técnico": si el rango
// filtrado (FILTER.hasta) llega hasta hoy o más adelante (o no hay filtro -
// "Todo el periodo"), se usa la hora real actual, así que el resultado
// avanza solo a medida que pasa el día. Si el rango filtrado ya terminó
// (una fecha pasada), se usa el final de ese rango como instante a evaluar,
// para mostrar quién estaba trabajando en ese momento.
function referenciaFiltro(){
  const ahora = new Date();
  if(FILTER.hasta && FILTER.hasta.getTime() < ahora.getTime()) return FILTER.hasta;
  return ahora;
}
/* "Dónde está cada técnico" - reutilizable desde la pestaña Técnicos y
   desde el KPI de Resumen Gerencial. Respeta el filtro de fecha a través
   del parámetro `referencia` (ver referenciaFiltro arriba): evalúa quién
   tiene una OT abierta o programada exactamente en ese instante, no en
   todo el rango. Solo considera técnicos internos (los
   proveedores/terceros no aplican). */
function calcularUbicacionTecnicos(referencia){
  const ahora = referencia || new Date();
  const ahoraMs = ahora.getTime();
  const ESTADO_PRIORIDAD = {conflicto:0, en_sitio:1, programado:2, sin_asignacion:3};
  const rows = tecnicosInternosList().map(tecnico=>{
    const otsTec = DATA.ot.filter(r=>
      (r.tipo==='Correctivo' || r.tipo==='Preventivo') && splitTecnicos(r.tecnico).includes(tecnico)
    );
    const abiertas = otsTec.filter(r=>
      r.inicio_real && new Date(r.inicio_real).getTime() <= ahoraMs &&
      (!r.fin_real || new Date(r.fin_real).getTime() > ahoraMs)
    );
    if(abiertas.length === 1){
      const r = abiertas[0];
      return {tecnico, estado:'en_sitio', equipo:r.equipo, lugar:r.lugar, otCodigo:r.ot, desde:r.inicio_real};
    }
    if(abiertas.length >= 2){
      return {tecnico, estado:'conflicto', equipo:null, lugar:null, otCodigo:abiertas.map(r=>r.ot).join(', '), desde:null};
    }
    const programadas = otsTec.filter(r=>
      !r.inicio_real && r.inicio_programado && r.fin_programado &&
      ahoraMs >= new Date(r.inicio_programado).getTime() && ahoraMs <= new Date(r.fin_programado).getTime()
    );
    if(programadas.length){
      programadas.sort((a,b)=> Math.abs(new Date(a.inicio_programado)-ahoraMs) - Math.abs(new Date(b.inicio_programado)-ahoraMs));
      const r = programadas[0];
      return {tecnico, estado:'programado', equipo:r.equipo, lugar:r.lugar, otCodigo:r.ot, desde:r.inicio_programado};
    }
    return {tecnico, estado:'sin_asignacion', equipo:null, lugar:null, otCodigo:null, desde:null};
  }).sort((a,b)=> ESTADO_PRIORIDAD[a.estado]-ESTADO_PRIORIDAD[b.estado]);
  return {rows, ahora};
}
/* Capacidad y horas trabajadas por técnico (42 h/semana, tope por jornada
   diaria). Compartido por la pestaña Técnicos y la tarjeta de técnicos del
   Resumen Gerencial, para que ambos muestren los mismos números. */
function calcularCapacidadTecnicos(){
  const {desde, hasta} = rangoEfectivoOT();
  // Sin "Desde" elegido el rango efectivo arranca en INICIO_USO_CMMS: las OT
  // anteriores tampoco cuentan, para que horas trabajadas y disponibles
  // correspondan al mismo periodo.
  const ot = getFilteredOT().filter(r=> FILTER.desde || !r.fecha_creacion || new Date(r.fecha_creacion) >= desde);
  const horasDisponibles = horasDisponiblesRango(desde, hasta);
  const semanas = horasDisponibles/42; // solo para mostrar un "N semanas" aproximado

  // Técnicos internos (planta) vs terceros: ver TECNICOS.xlsx en
  // process_dashboard.py. Si DATA.tecnicos_internos es null (no se encontró
  // el archivo), se trata a todos como internos - no se separa nadie.
  const tecnicosInternosSet = DATA.tecnicos_internos ? new Set(DATA.tecnicos_internos) : null;
  const esInterno = tecnico => tecnicosInternosSet ? tecnicosInternosSet.has(tecnico) : true;
  // Ver nota de clasificación en tres grupos junto a esOTProveedor()/esOTOtro()
  // (pestaña "Órdenes de Trabajo"): proveedor = no interno, pero sí está en
  // Datos Generales de Proveedores.xlsx; otro = no interno y tampoco está ahí.
  const proveedoresSet = proveedoresSetOf();
  const esProveedorRegistrado = tecnico => proveedoresSet.has(tecnico);

  const capMap = new Map();
  if(DATA.tecnicos_internos){
    DATA.tecnicos_internos.forEach(t=>{
      if(!capMap.has(t)) capMap.set(t, {horas:0, ot:0, otsList:[]});
    });
  }
  DATA.ot.forEach(r=>{
    splitTecnicos(r.tecnico).forEach(t=>{
      if(!capMap.has(t)) capMap.set(t, {horas:0, ot:0, otsList:[]});
    });
  });
  // Tiempo trabajado SIN TOPE (decisión de Mariana, 29-sep-2026: "si trabaja
  // más horas también puede salir"): cada OT suma su duración real completa
  // (Fecha Fin Real − Fecha Inicio Real) a cada técnico, aunque pase de la
  // jornada del día o de 42 h/semana. Ojo: una OT que quedó abierta varios
  // días suma también esas noches (p. ej. OT 000130 = 169 h). Las OT de
  // domingo también suman aquí (Mariana: "todo debe ir en tiempo trabajado").
  ot.forEach(r=>{
    const dur = duracionRealOT(r);
    const esDomingo = r.inicio_real ? new Date(r.inicio_real).getDay()===0 : false;
    splitTecnicos(r.tecnico).forEach(t=>{
      const c = capMap.get(t);
      if(dur!=null){
        c.ot += 1;
        c.horas += dur;
      }
      c.otsList.push({codigo:r.ot, dur, extra:esDomingo, fecha:r.inicio_real||r.inicio_programado||r.fecha_creacion});
    });
  });
  const capRowsAll = [...capMap.entries()].map(([tecnico,c])=>{
    const ocupacion = horasDisponibles? (c.horas/horasDisponibles*100) : null;
    const otsList = [...c.otsList].sort((a,b)=> new Date(b.fecha||0) - new Date(a.fecha||0));
    // Sin tope, un técnico puede pasar lo programado: libres no baja de 0.
    return {tecnico, ot:c.ot, horasDisp:horasDisponibles, horasTrab:c.horas, ocupacion, libres:Math.max(0, horasDisponibles-c.horas), otsList};
  });
  const capRows = capRowsAll.filter(r=>esInterno(r.tecnico)).sort((a,b)=>(b.ocupacion||0)-(a.ocupacion||0));
  // Sin tabla "Otros" (pedido de Mariana): todo ejecutor no interno va en
  // "Servicios de proveedores"; si no está en el maestro de proveedores ni en
  // PROVEEDORES_EXTRA se marca "No registrado".
  const tercerosRows = capRowsAll.filter(r=>!esInterno(r.tecnico)).sort((a,b)=>b.horasTrab-a.horasTrab);
  return {desde, hasta, ot, horasDisponibles, semanas, tecnicosInternosSet, esInterno, proveedoresSet, esProveedorRegistrado, capRowsAll, capRows, tercerosRows};
}
function renderTecnicos(el){
  const {desde, hasta, ot, horasDisponibles, semanas, tecnicosInternosSet, esInterno, proveedoresSet, esProveedorRegistrado, capRowsAll, capRows, tercerosRows} = calcularCapacidadTecnicos();

  // Promedios por técnico interno (mismos datos de "Capacidad y ocupación"):
  // OT realizadas = OT con duración real (Fecha Inicio y Fin Real); ocupación
  // por día = horas trabajadas (sin domingos) / días laborables del rango.
  // Solo técnicos que aparecen en alguna OT del histórico: los que están en

    <div class="section-note" style="margin:0 0 10px;">Respeta el filtro de fecha de arriba, evaluado al instante ${ahora.toLocaleDateString('es-CO')} ${ahora.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})} (${FILTER.hasta && FILTER.hasta.getTime()<new Date().getTime() ? 'el final del rango seleccionado' : 'la hora real actual, avanza a medida que pasa el día'}). "En sitio" = tiene una OT con Fecha Inicio Real sin Fecha Fin Real a esa hora (sigue ahí hasta que se cierre). "Programado" = no está en sitio, pero tiene una OT sin iniciar cuya ventana programada (Fecha Inicio Programado - Fecha Fin Programado) incluye ese momento. "⚠ Varios servicios abiertos" = tiene 2 o más OT abiertas al mismo tiempo — inconsistencia de datos a revisar, no se elige una al azar.</div>
    ${simpleTable(ubicacionRows, [
      {key:'tecnico', label:'Técnico'},
      {key:'estado', label:'Estado', fmt:v=>{
        const map = {
          en_sitio:['good','En sitio'],

  </div>
  <div class="callout info"><b>Horas disponibles</b> = suma de las horas hábiles de cada día del rango seleccionado: lunes a jueves 8 h, viernes 7 h, sábado 3 h (42 h/semana en total). El domingo no es laborable y no suma horas disponibles. <b>Horas trabajadas</b> = suma de la duración real completa (Fecha Fin Real − Fecha Inicio Real) de las OT del rango donde aparece el técnico en el campo Ejecutores, sin tope por jornada y domingos incluidos — por eso la ocupación puede pasar de 100%. <b>Nota:</b> cuando una OT tiene varios técnicos asignados, se cuenta la duración completa para cada uno — es una aproximación, no un reparto exacto del tiempo entre ellos.</div>
  <div class="card">

  ${tecnicosInternosSet ? `

/* ============ TAB: Solicitudes de Servicio ============ */
// Cumplimiento de una SS frente a su Fecha esperada (plazo de respuesta del
// CMMS), en 3 valores - mismo criterio que cumplimientoOT():
// 'si' = se respondió (Fecha de respuesta) en o antes de la Fecha esperada.
// 'no' = respondió tarde, O sigue sin respuesta y ya se pasó la Fecha esperada.
// 'pendiente' = todavía no llega la Fecha esperada.
// null = la SS no trae Fecha esperada (no se puede evaluar).
function cumplimientoSS(r){
  if(!r.fecha_esperada) return null;
  if(r.fecha_respuesta){
    return new Date(r.fecha_respuesta) <= new Date(r.fecha_esperada) ? 'si' : 'no';
  }
  const ahora = new Date();
  return ahora < new Date(r.fecha_esperada) ? 'pendiente' : 'no';
}
// Días de mora = cuánto se pasó (o lleva pasado) de la Fecha esperada. 0 si
// todavía está a tiempo o no aplica (sin Fecha esperada).
function diasMoraSS(r){
  if(!r.fecha_esperada) return null;
  const fin = r.fecha_respuesta? new Date(r.fecha_respuesta) : new Date();
  const dias = (fin - new Date(r.fecha_esperada))/86400000;
  return dias>0 ? dias : 0;
}
function cumplimientoStatsSS(rows){
  const conFecha = rows.filter(r=>r.fecha_esperada);
  const c = {si:0, no:0, pendiente:0};
  conFecha.forEach(r=>{ c[cumplimientoSS(r)]++; });
  const total = conFecha.length || 1;
  return {...c, total:conFecha.length, sinDato: rows.length-conFecha.length,
    pctSi:conFecha.length?c.si/total*100:null, pctNo:conFecha.length?c.no/total*100:null, pctPendiente:conFecha.length?c.pendiente/total*100:null};
}
function renderSS(el){
  let all = getFilteredSS();
  if(!FILTER.lugarGlobal && ssLugarFiltro.value) all = all.filter(r=>r.lugar===ssLugarFiltro.value);
  const pendientes = all.filter(r=>r.estado==='Creada').length;
  const conRespuesta = all.filter(r=>r.fecha_respuesta);
  const tResp = conRespuesta.map(r=>(new Date(r.fecha_respuesta)-new Date(r.fecha_ss))/3600000);
  const promResp = tResp.length? tResp.reduce((a,b)=>a+b,0)/tResp.length : null;
  const cumplSS = cumplimientoStatsSS(all);
  const ssDia = promedioPorDia(all, 'fecha_ss', DATA.ss);
  // Antigüedad de las SS no resueltas (sin Fecha de respuesta): días desde la
  // Fecha de solicitud hasta hoy, promediado
  const ahoraSS = new Date();
  const edadesAbiertas = all.filter(r=>!r.fecha_respuesta && r.fecha_ss).map(r=>(ahoraSS - new Date(r.fecha_ss))/3600000);
  const promEdadAbiertas = edadesAbiertas.length ? edadesAbiertas.reduce((a,b)=>a+b,0)/edadesAbiertas.length : null;

  el.innerHTML = `
  <div class="callout info"><b>Tiempo de solución</b> = Fecha de respuesta menos Fecha de solicitud. Fecha de respuesta marca el <b>cierre</b> de la solicitud (no una simple revisión) y solo se llena cuando la SS queda en estado <b>Ejecutada</b>, <b>Evaluada</b> o <b>No aprobada</b> — ${conRespuesta.length} de ${all.length} SS en el rango. Cualquier otro estado (Creada, Editada, Leída, Programada en O.T., Validada) sigue abierto y no tiene Fecha de respuesta — el filtro "Todos los estados" del histórico abajo siempre refleja los estados reales del CMMS.</div>
  <div class="callout info"><b>Cumplimiento</b> = Fecha de respuesta vs. Fecha esperada (plazo del CMMS). <b>Cumplida</b> = respondida en o antes de la Fecha esperada. <b>Incumplida</b> = respondió tarde, o sigue abierta y ya se pasó la Fecha esperada. <b>Pendiente</b> = aún no llega la Fecha esperada. <b>Días de mora</b> = días pasados de la Fecha esperada (0 si está a tiempo) — ${cumplSS.total} de ${all.length} SS en el rango traen Fecha esperada.</div>
  <div class="kpi-row">
    ${kpiCard({label:'Total SS', value:all.length})}
    ${kpiPromedioDia('SS creadas por día (promedio)', ssDia)}
    ${kpiCard({label:'Pendientes de gestión (Creada)', value:pendientes, status: pendientes>all.length*0.5?'bad':'warn'})}
    ${kpiCard({label:'Tiempo de solución promedio (SS cerradas)', value:fmtDiasDeHoras(promResp)})}
    ${kpiCard({label:'Antigüedad promedio (SS no resueltas)', value:fmtDiasDeHoras(promEdadAbiertas)})}
  </div>
  <div class="card section-block">
    <div class="card-head"><h3>Cumplimiento de SS frente a la Fecha esperada</h3></div>
    ${stackBar([
      {label:'Cumplidas', value:cumplSS.si, color:'var(--good)'},
      {label:'Incumplidas', value:cumplSS.no, color:'var(--bad)'},
      {label:'Pendientes', value:cumplSS.pendiente, color:'var(--warn)'},
    ])}
    <div class="kpi-row" style="margin-top:14px;">
      ${kpiCard({label:'% Cumplidas a tiempo', value:fmtPct(cumplSS.pctSi), sub:`${cumplSS.si} de ${cumplSS.total} SS con Fecha esperada`, status:'good'})}
      ${kpiCard({label:'% Incumplidas', value:fmtPct(cumplSS.pctNo), sub:`${cumplSS.no} de ${cumplSS.total} SS con Fecha esperada`, status:'bad'})}
      ${kpiCard({label:'% Pendientes', value:fmtPct(cumplSS.pctPendiente), sub:`${cumplSS.pendiente} de ${cumplSS.total} SS con Fecha esperada`, status:'warn'})}
    </div>
  </div>
  <div class="card section-block">
    <div class="card-head">
      <h3>SS por punto de venta</h3>
      ${lugarFiltroHtml('ssLugarSelect','ssLugarGlobal', ssLugarFiltro)}
    </div>
    <div id="ssPorLugarWrap"></div>
  </div>
  <div class="card section-block">
    ${sectionTitle('Histórico de Solicitudes de Servicio (SS)', `${all.length} SS en el rango seleccionado`)}
    <div class="card-head">
      <input class="searchbox" type="text" id="ssSearch" placeholder="Buscar por SS, equipo, lugar...">
      <select id="ssEstado"><option value="">Todos los estados</option>${[...new Set(DATA.ss.map(r=>r.estado))].map(e=>`<option>${e}</option>`).join('')}</select>
      <select id="ssTipo"><option value="">Todos los tipos</option>${[...new Set(DATA.ss.map(r=>r.tipo))].map(e=>`<option>${e}</option>`).join('')}</select>
    </div>
    <div id="ssTableWrap"></div>
  </div>
  `;

  const cols = [
    {key:'ss', label:'SS'},
    {key:'tipo', label:'Tipo'},
    {key:'severidad', label:'Sever.'},
    {key:'equipo', label:'Equipo'},
    {key:'lugar', label:'Lugar'},
    {key:'fecha_ss', label:'Fecha SS', fmt:fmtDate},
    {key:'fecha_esperada', label:'Fecha esperada', fmt:fmtDate},
    {key:'fecha_respuesta', label:'Fecha de respuesta', fmt:fmtDate},
    {key:'_cumplimiento', label:'Cumplimiento', fmt:(v,r)=>{
      const st = cumplimientoSS(r);
      if(st==='si') return '<span class="badge good">Cumplió</span>';
      if(st==='no') return '<span class="badge bad">No cumplió</span>';
      if(st==='pendiente') return '<span class="badge warn">Pendiente</span>';
      return '—';
    }, sortVal:r=>({si:0, no:1, pendiente:2}[cumplimientoSS(r)] ?? 3)},
    {key:'_mora', label:'Días de mora', num:true, fmt:(v,r)=>{ const d=diasMoraSS(r); return d==null?'—':d.toFixed(1); }, sortVal:r=>diasMoraSS(r)},
    {key:'estado', label:'Estado', fmt:v=>`<span class="badge neutral">${v}</span>`},
    {key:'ot_asociada', label:'OT'},
    {key:'descripcion', label:'Descripción'},
  ];
  let ssPager = buildPagedTable('ssTableWrap', all, cols, {pageSize:15});
  function refresh(){
    const est = document.getElementById('ssEstado').value;
    const tip = document.getElementById('ssTipo').value;
    let rows = all;
    if(est) rows = rows.filter(r=>r.estado===est);
    if(tip) rows = rows.filter(r=>r.tipo===tip);
    ssPager.refresh(rows);
    const term = document.getElementById('ssSearch').value;
    if(term) ssPager.setFilter(term);
  }
  document.getElementById('ssSearch').addEventListener('input', refresh);
  document.getElementById('ssEstado').addEventListener('change', refresh);
  document.getElementById('ssTipo').addEventListener('change', refresh);

  document.getElementById('ssPorLugarWrap').innerHTML = simpleTable(groupSSPorLugar(all), [
    {key:'lugar', label:'Punto de venta'},
    {key:'total', label:'Total SS', num:true},
    {key:'abiertas', label:'SS abiertas', num:true},
    {key:'pct', label:'% abiertas', num:true, fmt:v=>fmtPct(v)},
  ], {scroll:true});
  wireLugarFiltro('ssLugarSelect','ssLugarGlobal', ssLugarFiltro, ()=>renderSS(el));
}

/* ============ TAB: Costos ============ */
function renderCostos(el){
  const ot = getFilteredOT();
  const correctivo = ot.filter(r=>r.tipo==='Correctivo');
  const preventivo = ot.filter(r=>r.tipo==='Preventivo');
  const total = ot.reduce((s,r)=>s+(r.costo_real||0),0);
  const cCorr = correctivo.reduce((s,r)=>s+(r.costo_real||0),0);
  const cPrev = preventivo.reduce((s,r)=>s+(r.costo_real||0),0);

  const porLugar = groupSum(ot, r=>r.lugar, r=>r.costo_real||0).slice(0,10);
  const porEquipo = groupSum(ot, r=>r.equipo, r=>r.costo_real||0).slice(0,10).map(x=>{
    const n = ot.filter(r=>r.equipo===x.key).length;
    return {equipo:x.key, n, costo:x.sum};
  });

  el.innerHTML = `
  ${sectionTitle('Costos de mantenimiento')}
  <div class="callout info">El costo mostrado corresponde al campo "Total Real" de cada OT (mano de obra + materiales cuando aplica); los valores en $0 son costos reales en cero, no datos faltantes.</div>
  <div class="callout info">El <b>Costo total</b> es la suma de todos los mantenimientos (correctivos y preventivos) realizados dentro del rango de fechas seleccionado arriba.</div>
  <div class="kpi-row">
    ${kpiCard({label:'Costo total', value:fmtMoney(total)})}
    ${kpiCard({label:'Costo correctivo', value:fmtMoney(cCorr), sub:`${correctivo.length} OT`})}
    ${kpiCard({label:'Costo preventivo', value:fmtMoney(cPrev), sub:`${preventivo.length} OT`})}
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-head"><h3>Costo por sede</h3></div>
      ${porLugar.length? rankedTable(porLugar.map(x=>({lugar:x.key, costo:x.sum})), {labelKey:{key:'lugar',label:'Lugar'}, countKey:{key:'costo',label:'Costo'}, noBar:true, countFmt:fmtMoney}) : '<div class="empty">Sin datos</div>'}
    </div>
    <div class="card">
      <div class="card-head"><h3>Top 10 equipos por costo</h3></div>
      ${porEquipo.length? rankedTable(porEquipo, {labelKey:{key:'equipo',label:'Equipo'}, countKey:{key:'costo',label:'Costo total'}, extraCols:[{key:'n',label:'Mantenimientos'}], noBar:true, countFmt:fmtMoney}) : '<div class="empty">Sin datos</div>'}
    </div>
  </div>
  `;
}
